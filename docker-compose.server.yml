# =============================================================================
# Tennis Tracking - Docker Compose para Servidor de Producao
# =============================================================================
# Arquitetura separada: Backend (FastAPI) + Frontend (Nginx) + Redis + Worker
#
# Proxy reverso externo (Nginx Proxy Manager):
#   - tennis.tarcisiobannwart.com       -> tennis-tracking-frontend:3000
#   - tennis-api.tarcisiobannwart.com   -> tennis-tracking-backend:8000
#
# Uso:
#   git pull && docker compose -f docker-compose.server.yml up -d --build
# =============================================================================

services:
  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tennis-tracking-backend
    environment:
      # PostgreSQL (infra-postgres compartilhado)
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://tennis_user:tennis_pass@infra-postgres:5432/tennis_tracking}
      - POSTGRES_URL=${POSTGRES_URL:-postgresql+asyncpg://tennis_user:tennis_pass@infra-postgres:5432/tennis_tracking}
      - POSTGRES_HOST=${POSTGRES_HOST:-infra-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-tennis_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tennis_pass}
      - POSTGRES_DB=${POSTGRES_DB:-tennis_tracking}

      # Redis
      - REDIS_URL=${REDIS_URL:-redis://tennis-tracking-redis:6379/0}

      # Ambiente
      - ENVIRONMENT=production

      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-https://tennis.tarcisiobannwart.com,https://tennis-api.tarcisiobannwart.com,http://localhost}

      # Seguranca
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-24}

      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}

      # Email
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@tennistrack.app}
      - FRONTEND_URL=${FRONTEND_URL:-https://tennis.tarcisiobannwart.com}

      # Jira Error Reporting
      - JIRA_BASE_URL=${JIRA_BASE_URL:-https://trademarketingforce.atlassian.net}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - JIRA_PROJECT_KEY=${JIRA_PROJECT_KEY:-TT}
      - JIRA_ERROR_REPORT_ENABLED=${JIRA_ERROR_REPORT_ENABLED:-true}

      # Timezone
      - TZ=America/Sao_Paulo
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - tt-uploads:/app/uploads
      - tt-logs:/app/logs
      - tt-output:/app/output
    networks:
      - tennis-network
      - infra-network
    restart: unless-stopped
    depends_on:
      tennis-tracking-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.tt.project=tennis-tracking"
      - "com.tt.service=backend"

  # Frontend (Nginx + React build)
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://tennis-api.tarcisiobannwart.com
    container_name: tennis-tracking-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - tennis-network
      - infra-network
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "com.tt.project=tennis-tracking"
      - "com.tt.service=frontend"

  # Video Processing Worker (Celery)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: tennis-tracking-worker
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://tennis_user:tennis_pass@infra-postgres:5432/tennis_tracking}
      - REDIS_URL=${REDIS_URL:-redis://tennis-tracking-redis:6379/0}
      - MODEL_PATH=/app/models
      - ENVIRONMENT=production
      - TZ=America/Sao_Paulo
    volumes:
      - tt-uploads:/app/uploads
      - tt-output:/app/output
    networks:
      - tennis-network
      - infra-network
    restart: unless-stopped
    depends_on:
      tennis-tracking-redis:
        condition: service_healthy
    labels:
      - "com.tt.project=tennis-tracking"
      - "com.tt.service=worker"

  # Redis dedicado para Tennis Tracking
  tennis-tracking-redis:
    image: redis:7-alpine
    container_name: tennis-tracking-redis
    command: redis-server --appendonly yes --save 60 1 --loglevel warning
    volumes:
      - tt-redis-data:/data
    networks:
      - tennis-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.tt.project=tennis-tracking"
      - "com.tt.service=cache"

volumes:
  tt-uploads:
    driver: local
  tt-logs:
    driver: local
  tt-output:
    driver: local
  tt-redis-data:
    driver: local

networks:
  tennis-network:
    driver: bridge
  infra-network:
    external: true
    name: docker_infra
