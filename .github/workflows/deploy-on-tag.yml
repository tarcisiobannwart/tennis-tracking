name: Deploy to Server on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "${{ secrets.SERVER_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy-key.pem
        chmod 600 ~/.ssh/deploy-key.pem
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

    - name: Deploy to server
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        IMAGE_TAG: ${{ github.ref_name }}
      run: |
        ssh -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << ENDSSH
          set -e

          echo "=== Tennis Tracking - Deploy $IMAGE_TAG ==="

          cd ~/docker/tennis-tracking

          # Guardar versao atual para rollback
          CURRENT_VERSION=\$(git describe --tags --abbrev=0 2>/dev/null || echo "unknown")
          echo "Versao atual: \$CURRENT_VERSION"

          # Pull e checkout da tag
          git fetch --all --tags
          git checkout $IMAGE_TAG

          # Parar containers
          docker compose -f docker-compose.server.yml down || true

          # Rebuild e iniciar
          docker compose -f docker-compose.server.yml up -d --build

          # Aguardar inicializacao
          echo "Aguardando servicos..."
          sleep 30

          # Verificar health do backend
          if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
            echo "Backend health OK!"
          else
            echo "AVISO: Backend health check falhou, verificar logs"
            docker compose -f docker-compose.server.yml logs --tail=50 backend
          fi

          # Status dos containers
          docker compose -f docker-compose.server.yml ps

          echo "Deploy $IMAGE_TAG concluido!"
        ENDSSH

    - name: Verify deployment
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}
      run: |
        sleep 10
        response=$(curl -s -o /dev/null -w "%{http_code}" http://$SERVER_IP:8000/health 2>/dev/null || echo "000")
        if [ "$response" = "200" ]; then
          echo "Backend is healthy (HTTP 200)"
        else
          echo "Health check returned HTTP $response - may still be starting"
        fi
