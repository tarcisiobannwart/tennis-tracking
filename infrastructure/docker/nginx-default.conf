# ==============================================================================
# Tennis Tracking - Nginx Server Block (Unified Image)
# ==============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Health check - proxy to backend
    location /health {
        access_log off;
        proxy_pass http://tt_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Nginx-only health check
    location /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "nginx-healthy\n";
    }

    # Static files com cache agressivo
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML files sem cache
    location ~* \.(?:html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # API proxy para backend
    location /api/ {
        proxy_pass http://tt_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        client_max_body_size 500M;
        proxy_request_buffering off;
    }

    # WebSocket support
    location /ws/ {
        proxy_pass http://tt_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Docs da API (Swagger)
    location /docs {
        proxy_pass http://tt_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://tt_backend;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://tt_backend;
        proxy_set_header Host $host;
    }

    # React Router (SPA) - fallback para index.html
    location / {
        try_files $uri $uri/ /index.html;
        limit_req zone=app_limit burst=50 nodelay;
    }

    # Negar acesso a arquivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
