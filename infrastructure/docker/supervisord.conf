# ==============================================================================
# Tennis Tracking - Supervisord Configuration (Unified Image)
# ==============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ==============================================================================
# Nginx (Frontend + Reverse Proxy)
# ==============================================================================
[program:nginx]
command=nginx -g "daemon off;"
autostart=%(ENV_START_NGINX)s
autorestart=true
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log
priority=100

# ==============================================================================
# Uvicorn (FastAPI Backend)
# ==============================================================================
[program:uvicorn]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers %(ENV_WORKERS)s --log-level info
directory=/app
autostart=%(ENV_START_API)s
autorestart=true
stdout_logfile=/app/logs/uvicorn.log
stderr_logfile=/app/logs/uvicorn_error.log
environment=PYTHONPATH="/app"
priority=200

# ==============================================================================
# Celery Worker (Video Processing Tasks)
# ==============================================================================
[program:celery-worker]
command=celery -A app.worker worker --loglevel=info --concurrency=2
directory=/app
autostart=%(ENV_START_WORKER)s
autorestart=true
stdout_logfile=/app/logs/celery_worker.log
stderr_logfile=/app/logs/celery_worker_error.log
environment=PYTHONPATH="/app"
stopwaitsecs=600
stopsignal=TERM
priority=300
