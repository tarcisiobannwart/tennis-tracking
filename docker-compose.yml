services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: tennis-tracking-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: tennis_admin_2024
      MONGO_INITDB_DATABASE: tennis_tracking
    volumes:
      - mongodb_data:/data/db
      - ./backend/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - tennis-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tennis-tracking-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis123
      POSTGRES_DB: tennis_tracking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tennis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis -d tennis_tracking"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: tennis-tracking-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - tennis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tennis-tracking-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://tennis:tennis123@postgres:5432/tennis_tracking
      - MONGODB_URL=mongodb://admin:tennis_admin_2024@mongodb:27017/tennis_tracking?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_HOURS=24
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000,http://192.168.0.78:3000,https://tennis.tarcisiobannwart.com,http://tennis.tarcisiobannwart.com
      - ENVIRONMENT=development
      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_MATCH_POINT_MONTHLY=${STRIPE_PRICE_MATCH_POINT_MONTHLY:-}
      - STRIPE_PRICE_GRAND_SLAM_MONTHLY=${STRIPE_PRICE_GRAND_SLAM_MONTHLY:-}
      # Email (Resend)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@tennistrack.app}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # MediaMTX
      - MEDIAMTX_RTMP_URL=rtmp://mediamtx:1935
      - MEDIAMTX_RTSP_URL=rtsp://mediamtx:8554
      - MEDIAMTX_HLS_URL=http://mediamtx:8888
      - MEDIAMTX_API_URL=http://mediamtx:9997
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tennis-network
      - infra
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: tennis-tracking-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
      - VITE_MEDIAMTX_HLS_URL=http://localhost:8888
      - VITE_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      - backend
    networks:
      - tennis-network
      - infra

  # MediaMTX - Media Server for live streaming
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: tennis-tracking-mediamtx
    restart: always
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP (input from mobile cameras)
      - "8888:8888"   # HLS (output for web frontend)
      - "8889:8889"   # WebRTC (low-latency option)
      - "9997:9997"   # API (stream status)
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml
      - recordings_data:/recordings
    networks:
      - tennis-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9997/v3/paths/list"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Video Processing Worker (for async processing)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: tennis-tracking-worker
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://tennis:tennis123@postgres:5432/tennis_tracking
      - MONGODB_URL=mongodb://admin:tennis_admin_2024@mongodb:27017/tennis_tracking?authSource=admin
      - REDIS_URL=redis://redis:6379
      - MODEL_PATH=/app/models
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tennis-network
    command: celery -A app.worker worker --loglevel=info

volumes:
  mongodb_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  recordings_data:
    driver: local

networks:
  tennis-network:
    driver: bridge
  infra:
    external: true
    name: docker_infra
